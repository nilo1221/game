  <div id="cookie-banner" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,18,16,0.95); color: #f1efe8; padding: 12px 16px; font: 13px sans-serif; z-index: 9999; display: flex; align-items: center; justify-content: center; gap: 16px; border-top: 1px solid rgba(232,228,216,0.2);">
    <span>Utilizziamo cookie di terze parti (Google Analytics) per analizzare il traffico. <a href="privacy.html" style="color: #e8c93c; text-decoration: underline;">Privacy policy</a></span>
    <button onclick="acceptCookies()" style="background: #e8c93c; color: #1a1510; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Accetta</button>
    <button onclick="declineCookies()" style="background: transparent; color: #f1efe8; border: 1px solid #f1efe8; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Rifiuta</button>
  </div>

      if (c === 'true') acceptCookies();
      else if (c === 'false') hideCookieBanner();
    })();
  </script>
  <script>
    (function() {
      const nameInput = document.getElementById('player-name');
      const emailInput = document.getElementById('player-email');
      const passwordInput = document.getElementById('player-password');
      const saved = (typeof SaveGame !== 'undefined' && SaveGame.getName) ? SaveGame.getName() : '';
      if (saved) nameInput.value = saved;
      const offlineBtn = document.getElementById('play-offline');
      const onlineBtn = document.getElementById('play-online');
      const registerBtn = document.getElementById('register-btn');
      const authMessage = document.getElementById('auth-message');

      function getName() {
        return (nameInput.value || 'Nilo1221').trim().slice(0, 16);
      }
      function getEmail() { return (emailInput.value || '').trim(); }
      function getPassword() { return passwordInput.value || ''; }
      function showAuthMessage(msg) { if (authMessage) authMessage.textContent = msg; }

      async function tryOnline() {
        const name = getName();
        const email = getEmail();
        const password = getPassword();
        if (typeof CloudSave !== 'undefined' && CloudSave.enabled) {
          if (CloudSave.loggedIn) {
            window.startGame(name, true);
            return;
          }
          if (!email || !password) { showAuthMessage('Inserisci email e password'); return; }
          try {
            showAuthMessage('Accesso in corso...');
            await CloudSave.login(email, password);
            const data = await CloudSave.load();
            if (typeof window.applyCloudData === 'function') window.applyCloudData(data);
            showAuthMessage('');
            window.startGame(getName(), true);
          } catch (e) {
            showAuthMessage(e.message || 'Errore di accesso');
          }
        } else {
          showAuthMessage('Cloud non configurato: gioca offline o compila js/config/appwrite.js');
        }
      }

      async function tryRegister() {
        const name = getName();
        const email = getEmail();
        const password = getPassword();
        if (typeof CloudSave === 'undefined' || !CloudSave.enabled) { showAuthMessage('Cloud non configurato'); return; }
        if (!email || !password) { showAuthMessage('Inserisci email e password'); return; }
        try {
          showAuthMessage('Registrazione in corso...');
          await CloudSave.register(name, email, password);
          const data = await CloudSave.load();
          if (typeof window.applyCloudData === 'function') window.applyCloudData(data);
          showAuthMessage('');
          window.startGame(getName(), true);
        } catch (e) {
          showAuthMessage(e.message || 'Errore registrazione');
        }
      }

      offlineBtn.addEventListener('click', () => {
        window.startGame(getName(), false);
      });
      onlineBtn.addEventListener('click', tryOnline);
      registerBtn.addEventListener('click', tryRegister);

      const chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const text = chatInput.value.trim();
            if (text && typeof window.sendChat === 'function') {
              window.sendChat(text);
            }
            chatInput.value = '';
          }
        });
      }
    })();
  </script>
  <script>
    (function() {
      const premiumBtn = document.getElementById('premium-btn');
      const startCard = document.querySelector('#start-overlay .start-card');
      const premiumCard = document.getElementById('premium-card');
      const premiumBack = document.getElementById('premium-back');
      const packsEl = document.getElementById('premium-packs');
      const affiliatesEl = document.getElementById('premium-affiliates');
      const balanceEl = document.getElementById('premium-balance');
      const msgEl = document.getElementById('premium-message');

      function updateBalance() {
        try {
          const raw = localStorage.getItem(SaveGame.KEY);
          const data = raw ? JSON.parse(raw) : {};
          if (balanceEl) balanceEl.textContent = data.premium || 0;
        } catch (e) { console.warn(e); }
      }
      function showPremium() {
        if (startCard) startCard.style.display = 'none';
        if (premiumCard) {
          premiumCard.style.display = 'block';
          updateBalance();
        }
      }
      function hidePremium() {
        if (premiumCard) premiumCard.style.display = 'none';
        if (startCard) startCard.style.display = 'block';
      }
      if (premiumBtn) premiumBtn.addEventListener('click', showPremium);
      if (premiumBack) premiumBack.addEventListener('click', hidePremium);

      if (packsEl && typeof Payments !== 'undefined') {
        Object.entries(Payments.PACKS).forEach(([id, pack]) => {
          const btn = document.createElement('button');
          btn.className = 'start-btn online';
          btn.textContent = pack.gems + ' gemme - ' + pack.price;
          btn.addEventListener('click', () => {
            Payments.purchase(id, () => {
              if (typeof SaveGame !== 'undefined' && SaveGame.addPremium) {
                SaveGame.addPremium(pack.gems);
                updateBalance();
              }
              if (msgEl) msgEl.textContent = 'Acquistato ' + pack.gems + ' gemme!';
            });
          });
          packsEl.appendChild(btn);
        });
      }

      if (affiliatesEl && typeof AFFILIATES !== 'undefined') {
        const title = document.createElement('strong');
        title.textContent = 'Offerte sponsorizzate';
        title.style.color = '#e8c93c';
        affiliatesEl.appendChild(title);
        AFFILIATES.forEach((aff) => {
          const a = document.createElement('a');
          a.href = aff.url;
          a.target = '_blank';
          a.rel = 'noopener,noreferrer';
          a.textContent = aff.name + ' - ' + aff.description;
          a.style.color = '#e8e4d8';
          a.style.textDecoration = 'underline';
          affiliatesEl.appendChild(a);
        });
      }
    })();
  </script>
