<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Shattered Vale è un GDR di sopravvivenza gratuito per browser. Esplora un villaggio dimenticato, combatti mostri, forgi equipaggiamento e sopravvivi nelle terre selvagge." />
<meta name="keywords" content="RPG, survival, browser game, HTML5, canvas, indie game" />
<meta property="og:title" content="Shattered Vale: GDR di Sopravvivenza" />
<meta property="og:description" content="Un GDR di sopravvivenza gratuito per browser. Esplora, combatti, forgi e sopravvivi." />
<meta property="og:image" content="screenshots/screenshot01.jpg" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shattered Vale: GDR di Sopravvivenza" />
<meta name="twitter:description" content="Un GDR di sopravvivenza gratuito per browser. Esplora, combatti, forgi e sopravvivi." />
<meta name="twitter:image" content="screenshots/screenshot01.jpg" />
<link rel="canonical" href="https://shattered-vale.vercel.app/" />
<title>Shattered Vale: GDR di Sopravvivenza</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
<!-- Google tag (gtag.js) — loaded only after cookie consent -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  let gtagLoaded = false;
  function loadGtag() {
    if (gtagLoaded) return;
    gtagLoaded = true;
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-2BWEBX4Y4K';
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', 'G-2BWEBX4Y4K');
  }

  function hideCookieBanner() {
    const banner = document.getElementById('cookie-banner');
    if (banner) banner.style.display = 'none';
  }

  function acceptCookies() {
    localStorage.setItem('cookieConsent', 'true');
    hideCookieBanner();
    loadGtag();
  }

  function declineCookies() {
    localStorage.setItem('cookieConsent', 'false');
    hideCookieBanner();
  }
</script>
</head>
<body>

  <div id="hud">
    <div class="stat-group" id="hpGroup">
      <img class="stat-icon" src="assets/game/hud/heart.png" alt="Vita">
      <div class="bar-track"><div class="bar-fill hp-fill" id="hpBarInner"></div></div>
      <span class="stat-text" id="hpText">150/150</span>
    </div>
    <div class="stat-group" id="manaGroup">
      <div class="stat-icon">🌀</div>
      <div class="bar-track"><div class="bar-fill mana-fill" id="manaBarInner"></div></div>
      <span class="stat-text" id="manaText">100/100</span>
    </div>
    <div class="stat-group" id="xpGroup">
      <div class="stat-icon">⭐</div>
      <span class="stat-label">Liv <span id="lvlText">1</span></span>
      <div class="bar-track"><div class="bar-fill xp-fill" id="xpBarInner"></div></div>
      <span class="stat-text" id="xpText">0 / 10 Esp</span>
    </div>
    <div class="stat-group" id="goldGroup">
      <img class="gold-icon" src="assets/game/items/gold.png" alt="Oro">
      <span class="stat-text" id="goldText">0</span>
    </div>
    <div class="stat-group" id="premiumGroup">
      <img class="gold-icon" src="assets/game/items/gem.png" alt="Gemme">
      <span class="stat-text" id="premiumText">0</span>
    </div>
    <div class="stat-group" id="honorGroup" title="Onore PvP">
      <span class="stat-icon">⚔️</span>
      <span class="stat-text" id="honorText">0</span>
    </div>
    <div class="stat-group" id="hungerGroup">
      <div class="stat-icon">🍞</div>
      <div class="bar-track"><div class="bar-fill hunger-fill" id="hungerBarInner"></div></div>
      <span class="stat-text" id="hungerText">100/100</span>
    </div>
    <div class="stat-group" id="thirstGroup">
      <div class="stat-icon">💧</div>
      <div class="bar-track"><div class="bar-fill thirst-fill" id="thirstBarInner"></div></div>
      <span class="stat-text" id="thirstText">100/100</span>
    </div>
  </div>

  <div id="gameWrap">
    <canvas id="game" width="960" height="600"></canvas>
  </div>

  <div id="start-overlay">
    <div class="start-card">
      <h1>Shattered Vale</h1>
      <input id="player-name" type="text" placeholder="Nome giocatore" value="Nilo1221" maxlength="16" />
      <input id="player-email" type="email" placeholder="Email" />
      <input id="player-password" type="password" placeholder="Password" />
      <div class="start-actions">
        <button id="play-offline" class="start-btn offline">Gioca offline</button>
        <button id="play-online" class="start-btn online">Entra online</button>
        <button id="register-btn" class="start-btn register">Registrati</button>
      </div>
      <p id="auth-message" class="auth-message"></p>
      <p class="start-hint">I giocatori online sono nel tuo stesso server.</p>
    </div>
  </div>

  <div id="chat-ui">
    <div id="chat-log"></div>
    <input id="chat-input" type="text" maxlength="120" placeholder="Scrivi e premi Invio..." autocomplete="off" />
  </div>

  <!-- utils first: shared math/canvas helpers nearly everything depends on -->
  <script src="js/utils.js"></script>

  <!-- config: pure data, no dependencies -->
  <script src="js/config/balance.js"></script>
  <script src="js/config/level-layout.js"></script>
  <script src="js/config/item-effects.js"></script>
  <script src="js/config/item-stats.js"></script>
  <script src="js/config/shop-pool.js"></script>
  <script src="js/config/affiliates.js"></script>
  <script src="js/config/appwrite.js"></script>

  <!-- sprites: builder functions, then the registry that calls them -->
  <script src="js/sprites/humanoid-sprites.js"></script>
  <script src="js/sprites/monster-sprites.js"></script>
  <script src="js/sprites/molten-sprites.js"></script>
  <script src="js/sprites/icon-sprites.js"></script>
  <script src="js/sprites/sprites.js"></script>

  <!-- world: builder + renderer, then the TileMap class that composes them -->
  <script src="js/world/tilemap-builder.js"></script>
  <script src="js/world/tilemap-renderer.js"></script>
  <script src="js/world/tilemap.js"></script>

  <!-- entities -->
  <script src="js/entities/animated-sprite.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/entities/npc.js"></script>
  <script src="js/entities/enemy.js"></script>
  <script src="js/entities/fireball.js"></script>

  <!-- systems -->
  <script src="js/systems/camera.js"></script>
  <script src="js/systems/particles.js"></script>
  <script src="js/systems/dialogue.js"></script>
  <script src="js/systems/inventory.js"></script>
  <script src="js/systems/merchant.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/services/appwrite-client.js"></script>
  <script src="js/systems/payments.js"></script>
  <script src="js/systems/audio.js"></script>

  <!-- ui -->
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/shop.js"></script>

  <!-- core: input, world assembly, combat resolution, then the orchestrator -->
  <script src="js/core/input.js"></script>
  <script src="js/core/world-factory.js"></script>
  <script src="js/core/combat.js"></script>
  <script src="js/core/game.js"></script>

  <div id="cookie-banner" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,18,16,0.95); color: #f1efe8; padding: 12px 16px; font: 13px sans-serif; z-index: 9999; display: flex; align-items: center; justify-content: center; gap: 16px; border-top: 1px solid rgba(232,228,216,0.2);">
    <span>Utilizziamo cookie di terze parti (Google Analytics) per analizzare il traffico. <a href="privacy.html" style="color: #e8c93c; text-decoration: underline;">Privacy policy</a></span>
    <button onclick="acceptCookies()" style="background: #e8c93c; color: #1a1510; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Accetta</button>
    <button onclick="declineCookies()" style="background: transparent; color: #f1efe8; border: 1px solid #f1efe8; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Rifiuta</button>
  </div>
  <script>
    (function() {
      const c = localStorage.getItem('cookieConsent');
      if (c === 'true') acceptCookies();
      else if (c === 'false') hideCookieBanner();
    })();
  </script>
  <script>
    (function() {
      const nameInput = document.getElementById('player-name');
      const emailInput = document.getElementById('player-email');
      const passwordInput = document.getElementById('player-password');
      const saved = (typeof SaveGame !== 'undefined' && SaveGame.getName) ? SaveGame.getName() : '';
      if (saved) nameInput.value = saved;
      const offlineBtn = document.getElementById('play-offline');
      const onlineBtn = document.getElementById('play-online');
      const registerBtn = document.getElementById('register-btn');
      const authMessage = document.getElementById('auth-message');

      function getName() {
        return (nameInput.value || 'Nilo1221').trim().slice(0, 16);
      }
      function getEmail() { return (emailInput.value || '').trim(); }
      function getPassword() { return passwordInput.value || ''; }
      function showAuthMessage(msg) { if (authMessage) authMessage.textContent = msg; }

      async function tryOnline() {
        const name = getName();
        const email = getEmail();
        const password = getPassword();
        if (typeof CloudSave !== 'undefined' && CloudSave.enabled) {
          if (CloudSave.loggedIn) {
            window.startGame(name, true);
            return;
          }
          if (!email || !password) { showAuthMessage('Inserisci email e password'); return; }
          try {
            showAuthMessage('Accesso in corso...');
            await CloudSave.login(email, password);
            const data = await CloudSave.load();
            if (typeof window.applyCloudData === 'function') window.applyCloudData(data);
            showAuthMessage('');
            window.startGame(getName(), true);
          } catch (e) {
            showAuthMessage(e.message || 'Errore di accesso');
          }
        } else {
          showAuthMessage('Cloud non configurato: gioca offline o compila js/config/appwrite.js');
        }
      }

      async function tryRegister() {
        const name = getName();
        const email = getEmail();
        const password = getPassword();
        if (typeof CloudSave === 'undefined' || !CloudSave.enabled) { showAuthMessage('Cloud non configurato'); return; }
        if (!email || !password) { showAuthMessage('Inserisci email e password'); return; }
        try {
          showAuthMessage('Registrazione in corso...');
          await CloudSave.register(name, email, password);
          const data = await CloudSave.load();
          if (typeof window.applyCloudData === 'function') window.applyCloudData(data);
          showAuthMessage('');
          window.startGame(getName(), true);
        } catch (e) {
          showAuthMessage(e.message || 'Errore registrazione');
        }
      }

      offlineBtn.addEventListener('click', () => {
        window.startGame(getName(), false);
      });
      onlineBtn.addEventListener('click', tryOnline);
      registerBtn.addEventListener('click', tryRegister);

      const chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const text = chatInput.value.trim();
            if (text && typeof window.sendChat === 'function') {
              window.sendChat(text);
            }
            chatInput.value = '';
          }
        });
      }
    })();
  </script>
</body>
</html>
